import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
}

group 'com.huage2580'
version '2.1.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def localIdePath = providers.gradleProperty('localIdePath')

repositories {
    mavenCentral()
    // TinyPinyin 2.0.3 was published only to JCenter; limit the archived mirror to this module.
    maven {
        url = uri('https://maven.aliyun.com/repository/jcenter')
        content {
            includeModule('com.github.promeg', 'tinypinyin')
        }
    }
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'com.github.promeg:tinypinyin:2.0.3'
    implementation('org.quartz-scheduler:quartz:2.3.2') {
        exclude group: 'com.zaxxer'
        exclude group: 'org.slf4j' // Use the logging API supplied by the IDE.
        exclude group: 'com.mchange'
    }
    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        if (localIdePath.isPresent()) {
            local(localIdePath.get())
        } else {
            intellijIdea('2026.2.3')
        }
        pluginVerifier()
        testFramework(TestFrameworkType.Platform.INSTANCE)
    }
}

intellijPlatform {
    buildSearchableOptions = false
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '262.10968.63'
            untilBuild = '262.*'
        }
        changeNotes = '''
            v2.1.1 适配 IntelliJ IDEA 2026.2.3，显式打包运行依赖，更新通知及内容工厂 API。
        '''
    }
    pluginVerification {
        // All plugin dependencies are supplied by the target IDE or packaged in this distribution.
        freeArgs = ['-offline']
        ides {
            current()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('runIde') {
    // This plugin uses Swing forms and does not need the Compose hot-reload agent.
    composeHotReload = false
    composeHotReloadAgentConfiguration.setFrom([])
}

tasks.named('test') {
    useJUnit()
    systemProperty 'idea.load.plugins.id', 'com.intellij,com.huage2580.leeks'
    def distribution = tasks.named('buildPlugin').flatMap { it.archiveFile }
    dependsOn tasks.named('buildPlugin')
    inputs.file(distribution)
    systemProperty 'leeks.distribution', distribution.get().asFile.absolutePath
}
